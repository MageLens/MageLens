# Reuse upstream services; only local ports, mounts, and coverage tooling differ.
services:
  app:
    extends:
      file: .runtime/docker-magento/compose/compose.yaml
      service: app
    ports: !override
      - "127.0.0.1:${APPLICATION_PORT:-80}:${APPLICATION_PORT:-80}"
      - "127.0.0.1:${APPLICATION_HTTPS_PORT:-443}:${APPLICATION_HTTPS_PORT:-443}"
      - "127.0.0.1:${RUNNER_VIEW_PORT:-${CYPRESS_VIEW_PORT:-6080}}:${RUNNER_VIEW_PORT:-${CYPRESS_VIEW_PORT:-6080}}"
    networks:
      default:
        aliases: ["${APPLICATION_DOMAIN:-magelens.test}"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      APPLICATION_HTTPS_PORT: ${APPLICATION_HTTPS_PORT:-443}
    # Upstream SSL tools create their temporary certificate files here.
    working_dir: /tmp
    volumes: !override
      - ./src:/var/www/html:ro
      # Keep the installer's socket ownership when an empty volume is mounted.
      - type: volume
        source: sockdata
        target: /sock
        volume: {nocopy: true}
      - ./.runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssldata:/etc/nginx/certs
    depends_on: [phpfpm]
  phpfpm:
    extends:
      file: .runtime/docker-magento/compose/compose.yaml
      service: phpfpm
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APPLICATION_UID: ${LOCAL_UID:-1000}
        APPLICATION_GID: ${LOCAL_GID:-1000}
        PHP_IMAGE: ${MAGELENS_PHP_IMAGE:?Run commands through bin/application-compose or install.sh}
        EXPECTED_PHP_VERSION: ${PHP_VERSION:?Missing dependencies.yaml configuration}
        PCOV_VERSION: ${PCOV_VERSION:?Missing dependencies.yaml configuration}
        PIE_VERSION: ${PIE_VERSION:?Missing dependencies.yaml configuration}
    image: magelens-php:${MAGENTO_VERSION}-php${PHP_VERSION}-pcov${PCOV_VERSION}-markshust${MARKSHUST_DOCKER_MAGENTO_VERSION}
    volumes: !override
      - ./src:/var/www/html
      - ./src:/source:ro
      - type: volume
        source: sockdata
        target: /sock
        volume: {nocopy: true}
      - ./coverage:/coverage
      - ./.runtime/pcov:/pcov-state
      - ./docker:/application/docker:ro
      - ./patches/cypress:/cypress-patches:ro
      - ./.runtime/magento:/bootstrap
      - composerdata:/var/www/.composer
    environment:
      APPLICATION_DOMAIN: ${APPLICATION_DOMAIN:-magelens.test}
      APPLICATION_HTTPS_PORT: ${APPLICATION_HTTPS_PORT:-443}
      RUNNER_VIEW_PORT: ${RUNNER_VIEW_PORT:-${CYPRESS_VIEW_PORT:-6080}}
      APPLICATION_UID: ${LOCAL_UID:-1000}
      APPLICATION_GID: ${LOCAL_GID:-1000}
      MAGENTO_VERSION: ${MAGENTO_VERSION:?Missing dependencies.yaml configuration}
      MAGELENS_PLATFORM: ${MAGELENS_PLATFORM:-magento}
      MAGELENS_PLATFORM_VERSION: ${MAGELENS_PLATFORM_VERSION:?Run commands through bin/application-compose or install.sh}
      MAGELENS_THEME: ${MAGELENS_THEME:-luma}
      HYVA_VERSION: ${HYVA_VERSION:?Missing dependencies.yaml configuration}
    healthcheck:
      test: ["CMD", "php", "/application/docker/php/healthcheck.php"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  # Explicit install-only job; the old volume is retained for safe migration.
  workspace:
    extends:
      service: phpfpm
    profiles: [tools]
    user: root
    entrypoint: [bash, /application/docker/php/expose-source.sh]
    volumes: !override
      - appdata:/legacy:ro
      - type: volume
        source: sockdata
        target: /sock
        volume: {nocopy: true}
      - ./src:/var/www/html
      - ./docker:/application/docker:ro
      - ./.runtime/magento:/bootstrap
      - composerdata:/var/www/.composer
  db:
    extends:
      file: .runtime/docker-magento/compose/compose.yaml
      service: db
    ports: !reset []
    healthcheck:
      test: ["CMD", "mariadb", "--host=127.0.0.1", "--user=magento", "--password=magento", "magento", "--execute=SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    extends:
      file: .runtime/docker-magento/compose/compose.yaml
      service: redis
    ports: !reset []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  opensearch:
    extends:
      file: .runtime/docker-magento/compose/compose.yaml
      service: opensearch
    ports: !reset []
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 30
  runner:
    init: true
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
      target: ${MAGELENS_RUNNER:-cypress}
      args:
        RUNNER_IMAGE: ${RUNNER_IMAGE:?Missing dependencies.yaml configuration}
        PLAYWRIGHT_RUNNER_IMAGE: ${PLAYWRIGHT_RUNNER_IMAGE:?Missing dependencies.yaml configuration}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp
      MAGELENS_RUNNER: ${MAGELENS_RUNNER:-cypress}
      MAGELENS_THEME: ${MAGELENS_THEME:-luma}
      CYPRESS_CACHE_FOLDER: /opt/cypress
      CYPRESS_BASE_URL: "https://${APPLICATION_DOMAIN:-magelens.test}:${APPLICATION_HTTPS_PORT:-443}"
      PLAYWRIGHT_BASE_URL: "https://${APPLICATION_DOMAIN:-magelens.test}:${APPLICATION_HTTPS_PORT:-443}"
      APPLICATION_DOMAIN: ${APPLICATION_DOMAIN:-magelens.test}
      APPLICATION_PORT: ${APPLICATION_PORT:-80}
      APPLICATION_HTTPS_PORT: ${APPLICATION_HTTPS_PORT:-443}
      RUNNER_VIEW_PORT: ${RUNNER_VIEW_PORT:-${CYPRESS_VIEW_PORT:-6080}}
    volumes:
      - .:/workspace
      - ./src:/source:ro
      - node_modules:/workspace/node_modules
    shm_size: 1gb
volumes:
  appdata:
  sockdata:
  dbdata:
  node_modules:
  composerdata:
  ssldata:
