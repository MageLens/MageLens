name: Build branching images
on:
  push:
    branches: [branching]
    paths:
      - 'branching/planner/**'
      - 'branching/images.cjs'
      - 'branching/runners/**'
      - 'bin/branching-image'
      - 'bin/image-inputs.cjs'
      - 'docker/runner/**'
      - '.dockerignore'
      - 'dependencies.yaml'
      - 'package.json'
      - 'tests/ci/*-image.sh'
      - 'tests/branching-plan-smoke.cjs'
      - 'tests/fixtures/branching-source/**'
      - '.github/workflows/orchestrator-image.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: branching-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'MageLens/MageLens' && github.ref == 'refs/heads/branching'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kind: [orchestrator, playwright]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve source fingerprint and qualified browser base
        id: inputs
        env:
          KIND: ${{ matrix.kind }}
        run: |
          IFS=$'\t' read -r hash package context < <(node branching/images.cjs describe "$KIND")
          [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
          printf 'hash=%s\npackage=%s\ncontext=%s\n' "$hash" "$package" "$context" >> "$GITHUB_OUTPUT"
          if [[ "$KIND" != orchestrator ]]; then
            base=$(node branching/images.cjs base "$KIND")
            echo "arguments=RUNNER_IMAGE=$base" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build runtime image (Rust build includes unit and CLI tests)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.inputs.outputs.context }}
          build-args: ${{ steps.inputs.outputs.arguments }}
          platforms: linux/amd64
          load: true
          tags: magelens-${{ steps.inputs.outputs.package }}:ci
          provenance: false
          cache-from: type=gha,scope=branching-${{ matrix.kind }}
          cache-to: type=gha,mode=max,scope=branching-${{ matrix.kind }}
          labels: |
            org.magelens.inputs=${{ steps.inputs.outputs.hash }}
            org.opencontainers.image.source=https://github.com/MageLens/MageLens
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Check runtime and image separation
        env:
          KIND: ${{ matrix.kind }}
          PACKAGE: ${{ steps.inputs.outputs.package }}
        run: bash "tests/ci/$KIND-image.sh" "magelens-$PACKAGE:ci"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        env:
          INPUT_HASH: ${{ steps.inputs.outputs.hash }}
          PACKAGE: ${{ steps.inputs.outputs.package }}
        run: |
          image="ghcr.io/magelens/$PACKAGE:inputs-$INPUT_HASH"
          docker tag "magelens-$PACKAGE:ci" "$image"
          docker push "$image"
          docker tag "magelens-$PACKAGE:ci" "ghcr.io/magelens/$PACKAGE:branching"
          docker push "ghcr.io/magelens/$PACKAGE:branching"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf 'Tested image: %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous image access
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          docker --config "$directory" pull "$IMAGE" || {
            echo 'For the first publication, set this GHCR package to Public, then rerun this job.' >&2
            exit 1
          }
