name: Publish predictor.ai
run-name: Publish predictor.ai 0.0.1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: predictor-package-0.0.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'MageLens/MageLens' && github.ref == 'refs/heads/branching'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare predictor model
        env:
          PART_1: ${{ vars.PREDICTOR_PUBLISH_0_0_1_PART_1 }}
          PART_2: ${{ vars.PREDICTOR_PUBLISH_0_0_1_PART_2 }}
          PART_3: ${{ vars.PREDICTOR_PUBLISH_0_0_1_PART_3 }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib
          expected = 'f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3'
          parts = [os.environ['PART_' + str(i)] for i in range(1, 4)]
          assert all(parts) and all(len(part) <= 32000 for part in parts), 'Missing or oversized model chunk'
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(''.join(parts), validate=True))) as stream:
              model = stream.read(4 * 1024 * 1024 + 1)
          assert len(model) <= 4 * 1024 * 1024, 'Model too large'
          assert hashlib.sha256(model).hexdigest() == expected, 'Model digest mismatch'
          parsed = json.loads(model)
          assert parsed['qualified'] is False, 'Expected the selected evaluation model'
          directory = pathlib.Path('.runtime/predictor/package/registry/models')
          directory.mkdir(parents=True)
          (directory / (expected + '.json')).write_bytes(model)
          print('Verified model: ' + expected)
          PY
          cp branching/predictor/Dockerfile .runtime/predictor/package/Dockerfile
      - name: Build and verify model package
        run: |
          docker build --tag ghcr.io/magelens/predictor.ai:0.0.1 .runtime/predictor/package
          expected=f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3
          docker run --rm --network none ghcr.io/magelens/predictor.ai:0.0.1 > .runtime/predictor/model-check.json
          echo "$expected  .runtime/predictor/model-check.json" | sha256sum -c -
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish predictor package
        run: |
          image=ghcr.io/magelens/predictor.ai:0.0.1
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo 'This package version already exists. Select a new version and model digest before publishing.' >&2
            exit 1
          fi
          docker push "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          [[ "$digest" =~ ^ghcr.io/magelens/predictor.ai@sha256:[a-f0-9]{64}$ ]]
          docker pull "$digest"
          docker run --rm --network none "$digest" > .runtime/predictor/published-model.json
          echo "f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3  .runtime/predictor/published-model.json" | sha256sum -c -
          printf 'Published predictor.ai 0.0.1: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
