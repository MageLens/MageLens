name: Static checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  copyright:
    name: Copyright and license notices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:copyright
      - run: node --test tests/copyright.test.cjs
