name: Cypress 16.2.1 cookie fix investigation
on:
  workflow_dispatch:
    inputs:
      investigation:
        type: choice
        options: [packaged, cookie, images, navigation, mageos-navigation, windows-warmup]
        default: cookie
permissions:
  contents: read
  actions: read
jobs:
  mageos-navigation:
    if: inputs.investigation == 'mageos-navigation' || inputs.investigation == 'windows-warmup'
    uses: ./.github/workflows/e2e-case.yml
    with:
      os: ${{ inputs.investigation == 'windows-warmup' && 'windows-latest' || 'ubuntu-latest' }}
      platform: mageos
      theme: luma
      runner: cypress
      sha: ${{ github.sha }}
  cookie:
    if: inputs.investigation == 'cookie'
    name: Validate primary-origin cookie fix in Cypress 16.2.1 source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      CYPRESS_INSTALL_BINARY: '0'
      NODE_OPTIONS: --max-old-space-size=4096
      CHILD_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: magelens
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cypress-io/cypress
          ref: 519d66d80b0ae1bd3f9581665ce69473b82af59b
          path: cypress
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Prepare bounded build resources
        run: |
          bash magelens/tests/ci/prepare-disk.sh
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libgbm1 libasound2t64 libnss3 libatk-bridge2.0-0t64 libxss1 xvfb xauth
          # Required by Cypress's source-development setup on Ubuntu 24.04+.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g yarn@1.22.22 --ignore-scripts --no-audit --no-fund
          df -h .
          free -h
      - name: Install locked Cypress source dependencies
        working-directory: cypress
        run: yarn install --frozen-lockfile --network-concurrency 4
      - name: Apply the source fix and its regression tests
        working-directory: cypress
        run: git apply ../magelens/tests/ci/cypress-primary-cookie.patch
      - name: Build Cypress with two workers
        id: build
        working-directory: cypress
        run: |
          yarn lerna run build --stream --concurrency 2
          yarn workspace @packages/electron build-binary
          yarn lerna run build-cli --stream --concurrency 2
          # Cypress skips this part of its normal postinstall when CI=true.
          yarn build-v8-snapshot-dev
      - name: Run proxy unit regressions
        working-directory: cypress
        run: |
          yarn workspace @packages/proxy test --maxWorkers=2 --minWorkers=1
          yarn workspace @packages/server test-unit test/unit/browsers/cdp_automation.spec.ts --maxWorkers=2 --minWorkers=1
      - name: Check the changed Cypress source
        working-directory: cypress
        run: |
          yarn workspace @packages/proxy eslint lib/http/util/top-simulation.ts test/unit/http/request-middleware.spec.ts test/unit/http/response-middleware.spec.ts test/unit/http/util/top-simulation.spec.ts
          yarn workspace @packages/proxy check-ts
          yarn workspace @packages/server eslint lib/browsers/cdp-protocol/cdp_automation.ts test/unit/browsers/cdp_automation.spec.ts
          yarn workspace @packages/server check-ts
      - name: Start the isolated cookie fixture
        id: fixture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node magelens/tests/ci/cookie-diagnosis.cjs > "$RUNNER_TEMP/cookie-fixture.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8123/start > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify browser cookie handling in Chrome
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        working-directory: cypress
        env:
          COOKIE_RESULT_PATH: ${{ runner.temp }}/cookie-chrome.json
        run: yarn cypress:run --project ../magelens --browser chrome --config-file tests/ci/cookie-diagnosis-config.cjs
      - name: Inspect every browser result
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          errors = []
          for browser in ('chrome',):
              report = Path(os.environ['RUNNER_TEMP']) / f'cookie-{browser}.json'
              if not report.is_file():
                  errors.append(f'{browser}: missing report')
                  continue
              result = json.loads(report.read_text())
              print(browser, result)
              if result['browserName'] != 'chrome' or result['totalTests'] != 9 or result['totalPassed'] != 9 or any(result[key] != 0 for key in ('totalFailed', 'totalPending', 'totalSkipped')):
                  errors.append(f'{browser}: incomplete regression tests')
          assert not errors, errors
          PY
      - name: Inspect fixture requests
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: cat "$RUNNER_TEMP/cookie-fixture.log"
  chrome-images:
    if: inputs.investigation == 'images' || inputs.investigation == 'navigation'
    name: Chrome installation and recovery / ${{ matrix.runner }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: ${{ inputs.investigation == 'navigation' && fromJSON('["cypress"]') || fromJSON('["cypress", "playwright"]') }}
    env:
      MAGELENS_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare disk
        run: bash tests/ci/prepare-disk.sh
      - name: Build the production runner with pinned Chrome
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source bin/dependencies
          load_dependencies dependencies.yaml
          mkdir -p .runtime/template-package
          image=$RUNNER_IMAGE
          [[ "$MAGELENS_RUNNER" != playwright ]] || image=$PLAYWRIGHT_RUNNER_IMAGE
          docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            --env CYPRESS_VERSION --env PLAYWRIGHT_VERSION --env TEMPLATE_COVERAGE_VERSION --env CYPRESS_CODE_COVERAGE_VERSION \
            --env MAGELENS_RUNNER --env ISTANBUL_LIB_COVERAGE_VERSION --env ISTANBUL_LIB_INSTRUMENT_VERSION \
            --env ISTANBUL_LIB_REPORT_VERSION --env ISTANBUL_REPORTS_VERSION --env NYC_VERSION --env npm_config_cache=/tmp/npm-cache \
            --entrypoint node "$image" bin/sync-dependencies.cjs
          docker build --file docker/runner/Dockerfile --target "$MAGELENS_RUNNER" \
            --build-arg RUNNER_IMAGE --build-arg PLAYWRIGHT_RUNNER_IMAGE --build-arg CHROME_VERSION \
            --build-arg CHROME_LINUX_X64_SHA256 --build-arg CHROME_LINUX_ARM64_SHA256 \
            --tag "magelens-chrome:$MAGELENS_RUNNER" .
      - name: Verify actual Chrome through every desktop restart
        if: inputs.investigation == 'images'
        timeout-minutes: 8
        run: bash tests/runner-container.sh "magelens-chrome:$MAGELENS_RUNNER"
      - name: Verify Cypress runtime or warm-up navigation in Chrome
        if: matrix.runner == 'cypress'
        timeout-minutes: 7
        env:
          INVESTIGATION: ${{ inputs.investigation }}
        run: |
          docker run --rm --name magelens-chrome-runtime --init --shm-size=1g --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env DISPLAY=:99 --env INVESTIGATION --mount "type=bind,source=$PWD,target=/workspace" \
            --volume /workspace/node_modules "magelens-chrome:cypress" bash -c '
              set -euo pipefail
              bash /opt/magelens/desktop.sh > /tmp/desktop.log 2>&1 &
              for attempt in {1..30}; do
                if node /opt/magelens/healthcheck.cjs; then break; fi
                sleep 1
              done
              node /opt/magelens/healthcheck.cjs
              if [[ "$INVESTIGATION" == navigation ]]; then
                node tests/warmup-browser.cjs
              else
                node tests/cypress-runtime.cjs
              fi
            '
      - name: Clean owned runtime
        if: always()
        run: |
          if docker container inspect magelens-chrome-runtime > /dev/null 2>&1; then
            docker logs magelens-chrome-runtime
            docker rm -fv magelens-chrome-runtime
          fi

  packaged:
    if: inputs.investigation == 'packaged'
    name: Packaged Cypress cookie fix / production Chrome runner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare bounded build resources
        run: bash tests/ci/prepare-disk.sh
      - name: Build the shared production runner
        timeout-minutes: 65
        run: |
          set -euo pipefail
          source bin/dependencies
          load_dependencies dependencies.yaml
          mkdir -p .runtime/template-package
          docker build --file docker/runner/Dockerfile --target cypress \
            --build-arg RUNNER_IMAGE --build-arg PLAYWRIGHT_RUNNER_IMAGE --build-arg CHROME_VERSION \
            --build-arg CHROME_LINUX_X64_SHA256 --build-arg CHROME_LINUX_ARM64_SHA256 \
            --tag magelens-cookie:source .
      - name: Run all nine cookie regressions in the packaged runner
        timeout-minutes: 5
        run: |
          mkdir -p cookie-evidence
          docker run --rm --name magelens-packaged-cookie --init --memory=4g --memory-swap=4g --cpus=2 --pids-limit=768 --shm-size=1g \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --mount "type=bind,source=$PWD/tests/ci,target=/workspace/tests/ci,readonly" \
            --mount "type=bind,source=$PWD/cookie-evidence,target=/evidence" \
            magelens-cookie:source bash tests/ci/packaged-cookie.sh
      - name: Clean owned runtime
        if: always()
        run: |
          if docker container inspect magelens-packaged-cookie > /dev/null 2>&1; then
            docker rm -fv magelens-packaged-cookie
          fi
      - name: Upload synthetic regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaged-cookie-evidence
          path: cookie-evidence/*.json
          retention-days: 1
          if-no-files-found: error
