name: Report diagnosis
on:
  workflow_dispatch:
    inputs:
      source-run:
        description: 'CI run containing the sanitized case artifacts'
        required: true
        type: string
      source-sha:
        description: 'Exact tested commit (PR merge SHA for PR runs)'
        required: true
        type: string
      source-attempt:
        description: 'Exact source run attempt'
        default: '1'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Diagnose available reports without qualifying a commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Retrieve current-attempt evidence from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source-run }}
          SOURCE_ATTEMPT: ${{ inputs.source-attempt }}
        run: gh run download "$SOURCE_RUN" --pattern "case-*-attempt-$SOURCE_ATTEMPT" --dir ci-artifacts
      - name: Compare available reports (missing jobs deliberately prevent qualification)
        env:
          SOURCE_RUN: ${{ inputs.source-run }}
          SOURCE_ATTEMPT: ${{ inputs.source-attempt }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: CI_NEEDS='{}' CI_SHA="$SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN" GITHUB_RUN_ATTEMPT="$SOURCE_ATTEMPT" node tests/ci/gate.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: report-diagnosis-${{ github.run_id }}
          path: ci-gate/
          retention-days: 1
          if-no-files-found: error
