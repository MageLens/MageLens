name: Host feasibility diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intel-host-probe-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  probe:
    name: Standard Intel Mac / Linux containers
    runs-on: macos-26-intel
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI_SHA: ${{ github.sha }}
      CI_HOST_RUNTIME: VZ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare local VM tools
        run: |
          brew install colima docker docker-compose bash
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -sf "$(brew --prefix docker-compose)/bin/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Probe actual Intel Mac, Linux containers, mounts and network
        timeout-minutes: 15
        run: |
          export MAGELENS_TEST_TMPDIR="$RUNNER_TEMP/magelens-e2e-tmp"
          mkdir -p "$MAGELENS_TEST_TMPDIR"
          node tests/ci/probe.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-26-intel-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/feasibility.json
          retention-days: 1
          if-no-files-found: error
      - name: Stop this diagnostic VM
        if: always()
        run: colima stop
