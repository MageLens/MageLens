name: Cypress 16.2.1 cookie fix investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cookie:
    name: Validate primary-origin cookie fix in Cypress 16.2.1 source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      CYPRESS_INSTALL_BINARY: '0'
      NODE_OPTIONS: --max-old-space-size=4096
      CHILD_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: magelens
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cypress-io/cypress
          ref: 519d66d80b0ae1bd3f9581665ce69473b82af59b
          path: cypress
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Prepare bounded build resources
        run: |
          bash magelens/tests/ci/prepare-disk.sh
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libgbm1 libasound2t64 libnss3 libatk-bridge2.0-0t64 libxss1 xvfb xauth
          # Required by Cypress's source-development setup on Ubuntu 24.04+.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g yarn@1.22.22 --ignore-scripts --no-audit --no-fund
          df -h .
          free -h
      - name: Install locked Cypress source dependencies
        working-directory: cypress
        run: yarn install --frozen-lockfile --network-concurrency 4
      - name: Apply the source fix and its regression tests
        working-directory: cypress
        run: |
          git apply ../magelens/tests/ci/cypress-primary-cookie.patch
          # Temporary tracing is limited to this credential-free fixture.
          python3 - <<'PY'
          from pathlib import Path
          for name, anchor in (
              ('attach-cross-origin-cookies', '  const currentAUTUrl = mw.getAUTUrl()'),
              ('copy-cookies-from-response', '  const doesTopNeedSimulating = doesTopNeedToBeSimulated(mw)'),
          ):
              path = Path('packages/proxy/lib/adapters') / f'{name}.ts'
              source = path.read_text()
              trace = "\n  console.log('COOKIE_DIAG ' + JSON.stringify({ phase: '" + name + "', aut: mw.getAUTUrl(), url: mw.req.proxiedUrl, primary: mw.remoteStates.isPrimarySuperDomainOrigin(mw.getAUTUrl() || ''), frame: mw.req.isAUTFrame, fetchSite: mw.req.headers['sec-fetch-site'], referer: mw.req.headers.referer, cookie: mw.req.headers.cookie }))\n"
              assert source.count(anchor) == 1
              path.write_text(source.replace(anchor, anchor + trace))
          PY
      - name: Build Cypress with two workers
        id: build
        working-directory: cypress
        run: |
          yarn lerna run build --stream --concurrency 2
          yarn workspace @packages/electron build-binary
          yarn lerna run build-cli --stream --concurrency 2
          # Cypress skips this part of its normal postinstall when CI=true.
          yarn build-v8-snapshot-dev
      - name: Run proxy unit regressions
        working-directory: cypress
        run: yarn workspace @packages/proxy test --maxWorkers=2 --minWorkers=1
      - name: Check the changed Cypress source
        working-directory: cypress
        run: |
          yarn workspace @packages/proxy eslint lib/adapters/attach-cross-origin-cookies.ts test/unit/http/request-middleware.spec.ts
          yarn workspace @packages/proxy check-ts
      - name: Start the isolated cookie fixture
        id: fixture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node magelens/tests/ci/cookie-diagnosis.cjs > "$RUNNER_TEMP/cookie-fixture.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8123/start > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify browser cookie handling in Electron
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        working-directory: cypress
        env:
          COOKIE_RESULT_PATH: ${{ runner.temp }}/cookie-electron.json
        run: yarn cypress:run --project ../magelens --browser electron --config-file tests/ci/cookie-diagnosis-config.cjs
      - name: Verify browser cookie handling in Chrome
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        working-directory: cypress
        env:
          COOKIE_RESULT_PATH: ${{ runner.temp }}/cookie-chrome.json
        run: yarn cypress:run --project ../magelens --browser chrome --config-file tests/ci/cookie-diagnosis-config.cjs
      - name: Inspect every browser result
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          errors = []
          for browser in ('electron', 'chrome'):
              report = Path(os.environ['RUNNER_TEMP']) / f'cookie-{browser}.json'
              if not report.is_file():
                  errors.append(f'{browser}: missing report')
                  continue
              result = json.loads(report.read_text())
              print(browser, result)
              if result['totalTests'] != 6 or result['totalPassed'] != 6 or any(result[key] != 0 for key in ('totalFailed', 'totalPending', 'totalSkipped')):
                  errors.append(f'{browser}: incomplete regression tests')
          assert not errors, errors
          PY
      - name: Inspect fixture requests
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: cat "$RUNNER_TEMP/cookie-fixture.log"
