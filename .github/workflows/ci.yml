name: Cypress rollback cookie diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cookie:
    name: Cookie replay on Cypress ${{ matrix.cypress }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cypress: ['16.2.0', '15.19.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce browser-cleared cookie handling independently of Magento
        env:
          CYPRESS_VERSION: ${{ matrix.cypress }}
        run: |
          docker run --rm --entrypoint bash -v "$PWD:/e2e" -w /e2e "cypress/included:$CYPRESS_VERSION" -c '
            node tests/ci/cookie-diagnosis.cjs &
            cypress run --config-file tests/ci/cookie-diagnosis-config.cjs
          '
      - name: Preserve existing TLS, compressed response and artifact checks
        if: ${{ !cancelled() }}
        env:
          CYPRESS_VERSION: ${{ matrix.cypress }}
        run: |
          docker run --rm --entrypoint bash -v "$PWD:/e2e" -w /e2e "cypress/included:$CYPRESS_VERSION" -c '
            export NODE_PATH="$(npm root -g)"
            xvfb-run -a node tests/cypress-runtime.cjs
          '
      - name: Inspect runtime results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for report in Path('coverage/cypress-runtime').glob('*/*/result.json'):
              result = json.loads(report.read_text())
              print(report, {key: result.get(key) for key in ('totalTests', 'totalPassed', 'totalFailed', 'totalPending', 'totalSkipped')})
              for run in result.get('runs', []):
                  for test in run.get('tests', []):
                      for attempt in test.get('attempts', []):
                          if attempt.get('error'):
                              print(test['title'], attempt['error'].get('message'))
          PY
