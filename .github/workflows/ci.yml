name: CI
on:
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  static:
    name: Static syntax and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tests/ci/static.cjs
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  integration:
    name: Integration and PHP unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rust checkpoint planner and repository-owned fixture
        env:
          MAGELENS_BRANCHING_BUILD_FROM_SOURCE: '1'
        run: |
          ./bin/plan-branching tests/fixtures/branching-source .runtime/branching-fixture-plan.json
          node tests/branching-plan-smoke.cjs .runtime/branching-fixture-plan.json
      - name: Run every integration test and reject skipped tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 --test-reporter=tap tests/*.test.cjs | tee "$RUNNER_TEMP/integration.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/integration.tap"
          grep -qx '# cancelled 0' "$RUNNER_TEMP/integration.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/integration.tap"
          grep -qx '# todo 0' "$RUNNER_TEMP/integration.tap"
      - name: PHP unit checks
        run: |
          for file in tests/env.test.php tests/theme.test.php tests/source.test.php; do php "$file"; done
          # Collection test uses fixed container paths; this runner is disposable.
          sudo mkdir /coverage /pcov-state
          sudo chown "$(id -u):$(id -g)" /coverage /pcov-state
          php tests/collection.test.php
          # PCOV/report tests run in each E2E case with the production PHP image.
  branching:
    name: Branching browser, provider and dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare private reflink storage
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xfsprogs
          bash tests/ci/cow-storage.sh create "$RUNNER_TEMP/branching-cow"
      - name: Run real provider and dashboard suites
        run: bash tests/ci/branching.sh "$RUNNER_TEMP/branching-cow/storage"
      - name: Remove private reflink storage
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/branching-cow/.magelens-cow-owner" ]]; then
            bash tests/ci/cow-storage.sh remove "$RUNNER_TEMP/branching-cow"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: branching-attempt-${{ github.run_attempt }}
          path: ci-reports/branching/
          retention-days: 1
          if-no-files-found: error
  copyright:
    name: Copyright and license notices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check:copyright
      - run: node --test tests/copyright.test.cjs
  e2e:
    name: Mage-OS E2E
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: windows-latest
            platform: mageos
            theme: luma
            runner: cypress
          - os: ubuntu-latest
            platform: mageos
            theme: luma
            runner: cypress
          - os: ubuntu-latest
            platform: mageos
            theme: luma
            runner: playwright
          - os: ubuntu-latest
            platform: mageos
            theme: hyva
            runner: cypress
          - os: ubuntu-latest
            platform: mageos
            theme: hyva
            runner: playwright
    uses: ./.github/workflows/e2e-case.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      theme: ${{ matrix.theme }}
      runner: ${{ matrix.runner }}
      sha: ${{ github.sha }}
  magento:
    name: Magento E2E
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        theme: [luma, hyva]
        runner: [cypress, playwright]
    uses: ./.github/workflows/e2e-case.yml
    secrets:
      COMPOSER_AUTH: ${{ vars.COMPOSER_AUTH }}
    with:
      os: ubuntu-latest
      platform: magento
      theme: ${{ matrix.theme }}
      runner: ${{ matrix.runner }}
      sha: ${{ github.sha }}
  gate:
    name: Required CI gate
    if: always()
    needs: [static, integration, copyright, branching, e2e, magento]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: case-*-attempt-${{ github.run_attempt }}
          path: ci-artifacts
      - name: Verify nine cases, same-theme report equality and the eight-way Linux comparison
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_SHA: ${{ github.sha }}
        run: node tests/ci/gate.cjs
      - name: Bound qualification artifact storage
        id: artifact-size
        if: always()
        run: node tests/ci/artifact-size.cjs ci-gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.artifact-size.outcome == 'success'
        with:
          name: qualification-${{ github.run_attempt }}
          path: ci-gate/
          retention-days: 1
          if-no-files-found: error
