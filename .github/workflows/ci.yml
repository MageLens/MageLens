name: Cookie diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cookie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce browser-cleared cookie handling independently of Magento
        run: |
          docker run --rm --entrypoint bash -v "$PWD:/e2e" -w /e2e cypress/included:16.2.1 -ec '
            node tests/ci/patch-cookie-diagnosis.cjs
            node tests/ci/cookie-diagnosis.cjs &
            cypress run --config-file tests/ci/cookie-diagnosis-config.cjs
          '
