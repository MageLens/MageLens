name: Publish predictor package 0.0.1
on:
  push:
    branches: [codex/publish-predictor-0.0.1]
    paths: ['.github/workflows/predictor-package.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: predictor-package-0.0.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'MageLens/MageLens' && github.ref == 'refs/heads/codex/publish-predictor-0.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Reconstruct explicitly selected model outside Git
        env:
          PART_1: ${{ vars.PREDICTOR_PUBLISH_0_0_1_PART_1 }}
          PART_2: ${{ vars.PREDICTOR_PUBLISH_0_0_1_PART_2 }}
          PART_3: ${{ vars.PREDICTOR_PUBLISH_0_0_1_PART_3 }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib
          expected = 'f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3'
          parts = [os.environ['PART_' + str(i)] for i in range(1, 4)]
          assert all(parts) and all(len(part) <= 32000 for part in parts), 'Missing or oversized model chunk'
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(''.join(parts), validate=True))) as stream:
              model = stream.read(4 * 1024 * 1024 + 1)
          assert len(model) <= 4 * 1024 * 1024, 'Model too large'
          assert hashlib.sha256(model).hexdigest() == expected, 'Model digest mismatch'
          parsed = json.loads(model)
          assert parsed['qualified'] is False, 'Expected the selected shadow snapshot'
          directory = pathlib.Path('context/registry/models')
          directory.mkdir(parents=True)
          (directory / (expected + '.json')).write_bytes(model)
          print('Verified selected shadow snapshot: ' + expected)
          PY
          cat > context/Dockerfile <<'DOCKERFILE'
          # SPDX-FileCopyrightText: Private Entrepreneur Vitalii Boiko
          # SPDX-License-Identifier: Elastic-2.0
          # License: see LICENSE in the repository root.
          
          FROM alpine:3.21
          LABEL org.opencontainers.image.source="https://github.com/MageLens/MageLens"
          LABEL org.opencontainers.image.title="predictor.ai"
          LABEL org.opencontainers.image.description="MageLens timing predictor model snapshot"
          LABEL org.opencontainers.image.version="0.0.1"
          LABEL org.magelens.predictor.model.sha256="f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3"
          
          RUN mkdir -p /opt/magelens/predictor/models
          COPY registry/models/f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3.json /opt/magelens/predictor/models/f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3.json
          RUN echo "f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3  /opt/magelens/predictor/models/f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3.json" | sha256sum -c -
          RUN ln -s /opt/magelens/predictor/models/f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3.json /opt/magelens/predictor/model.json
          
          ENTRYPOINT ["cat", "/opt/magelens/predictor/model.json"]
          DOCKERFILE
      - name: Build and verify model package
        run: |
          docker build --tag ghcr.io/magelens/predictor.ai:0.0.1 context
          expected=f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3
          docker run --rm --network none ghcr.io/magelens/predictor.ai:0.0.1 > model-check.json
          echo "$expected  model-check.json" | sha256sum -c -
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish model to GitHub Packages
        run: |
          image=ghcr.io/magelens/predictor.ai:0.0.1
          docker push "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          [[ "$digest" =~ ^ghcr.io/magelens/predictor.ai@sha256:[a-f0-9]{64}$ ]]
          docker pull "$digest"
          docker run --rm --network none "$digest" > published-model.json
          echo "f5621bb710749ca616117ef979b0a039c12680dee08f79a1cce46cde3413a8c3  published-model.json" | sha256sum -c -
          printf 'Published shadow model: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
