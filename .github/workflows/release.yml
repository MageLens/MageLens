name: Publish release

on:
  workflow_dispatch:
    inputs:
      ci-run:
        description: 'Successful PR CI run ID'
        required: true
        type: string
      release-sha:
        description: 'Full merged commit SHA to release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'MageLens/MageLens'
    permissions:
      contents: write
      actions: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      QUALIFIED_RUN: ${{ inputs.ci-run }}
      RELEASE_SHA: ${{ inputs.release-sha }}
    steps:
      - name: Verify successful PR qualification and identical release files
        run: |
          [[ "$QUALIFIED_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/actions/runs/$QUALIFIED_RUN" > ci-run.json
          jq -e --arg repo "$GH_REPO" '
            .status == "completed" and .conclusion == "success" and
            .event == "pull_request" and .path == ".github/workflows/ci.yml" and
            .repository.full_name == $repo
          ' ci-run.json
          QUALIFIED_ATTEMPT="$(jq -r .run_attempt ci-run.json)"
          gh run download "$QUALIFIED_RUN" --repo "$GH_REPO" --name "qualification-$QUALIFIED_ATTEMPT" --dir qualification
          jq -e --arg run "$QUALIFIED_RUN" --arg attempt "$QUALIFIED_ATTEMPT" \
            '.passed == true and .themeReportsEqual == true and .workflowRun == $run and .attempt == $attempt and .expectedCases == 9 and .completedCases == 9 and .expectedAcceptanceTests == 63 and (.errors | length) == 0 and ((.dependencyPreviews // {}) | length) == 0' qualification/qualification.json
          QUALIFIED_SHA="$(jq -r .sha qualification/qualification.json)"
          [[ "$QUALIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          QUALIFIED_TREE="$(gh api "repos/$GH_REPO/git/commits/$QUALIFIED_SHA" --jq .tree.sha)"
          RELEASE_TREE="$(gh api "repos/$GH_REPO/git/commits/$RELEASE_SHA" --jq .tree.sha)"
          [[ -n "$QUALIFIED_TREE" && "$QUALIFIED_TREE" == "$RELEASE_TREE" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release-sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release version and prepare notes
        run: |
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          RELEASE_TAG="v$(jq -r .version package.json)"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          awk -v version="${RELEASE_TAG#v}" '
            /^## / { if (selected) exit; selected = ($2 == version); next }
            selected { print }
          ' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]]
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$RELEASE_SHA" ]]
          fi
      - name: Prepare disposable image builder
        run: |
          bash tests/ci/prepare-disk.sh
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Check out trusted cleanup implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .cleanup-tools
      - name: Remove leftovers from previous failed releases
        run: node .cleanup-tools/tests/release/prune-images.cjs && rm -rf .cleanup-tools
  images:
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ inputs.release-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare native image builder
        run: |
          bash tests/ci/prepare-disk.sh
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Build, test and publish native tooling images
        run: bash tests/release/build-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .runtime/release-images/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [prepare, images]
    if: always() && needs.prepare.result == 'success'
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ inputs.release-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release-sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.images.result == 'success'
        with:
          pattern: release-images-*-${{ github.run_attempt }}
          path: .runtime/release-images
          merge-multiple: true
      - name: Validate complete native image set
        if: needs.images.result == 'success'
        run: node tests/release/images.cjs manifest .runtime/release-images .runtime/release-images/images.json
      - name: Publish release and image manifest
        if: needs.images.result == 'success'
        run: |
          RELEASE_TAG="v$(jq -r .version package.json)"
          awk -v version="${RELEASE_TAG#v}" '
            /^## / { if (selected) exit; selected = ($2 == version); next }
            selected { print }
          ' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]]
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --notes-file release-notes.md \
              --title "MageLens $RELEASE_TAG" --draft
          fi
          gh release upload "$RELEASE_TAG" .runtime/release-images/images.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Check out trusted cleanup implementation
        if: always() && needs.images.result != 'skipped'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .cleanup-tools
      - name: Retain images referenced by published releases
        if: always() && needs.images.result != 'skipped'
        run: node .cleanup-tools/tests/release/prune-images.cjs && rm -rf .cleanup-tools
