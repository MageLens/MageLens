[package]
name = "magelens-plan"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "Elastic-2.0"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
tree-sitter = "=0.25.10"
tree-sitter-typescript = "=0.23.2"

[profile.release]
lto = "thin"
strip = true
