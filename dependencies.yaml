# MageLens installation inputs. Edit this file, then run ./install.sh.
# Coverage scope and JavaScript build selection live in coverage.config.json.
# Use a flat mapping of quoted strings; comments and blank lines are supported.
# Release versions select matching Git tags (PCOV uses a v-prefixed tag).
MAGENTO_VERSION: "2.4.8-p5"
# Mage-OS 2.3.0 uses the same Magento 2.4.8-p5 foundation and service requirements.
MAGEOS_VERSION: "2.3.0"
# Selects Mark Shust's PHP build recipe and nginx, database, cache, and search images.
MARKSHUST_DOCKER_MAGENTO_VERSION: "53.2.0"
# Official PHP base used to rebuild the selected recipe.
PHP_IMAGE: "php:8.4.27-fpm-bookworm@sha256:df5a5113e1179ddf4560cd15727eb3812f6457829756d2a96c6c11bb4c250089"
PCOV_VERSION: "2.1.2"
PIE_VERSION: "1.5.5"
CYPRESS_VERSION: "16.2.1"
PLAYWRIGHT_VERSION: "1.64.1"
# Hyva CSP theme and companion module; legacy non-CSP Hyva is unsupported.
HYVA_VERSION: "1.5.3"
TEMPLATE_COVERAGE_VERSION: "1.5.3"
CYPRESS_CODE_COVERAGE_VERSION: "4.0.3"
ISTANBUL_LIB_COVERAGE_VERSION: "3.2.2"
ISTANBUL_LIB_INSTRUMENT_VERSION: "6.0.3"
ISTANBUL_LIB_REPORT_VERSION: "3.0.1"
ISTANBUL_REPORTS_VERSION: "3.2.0"
NYC_VERSION: "18.0.0"

# Node and browser system dependencies for the Cypress runner.
RUNNER_IMAGE: "cypress/base:24.22.1"
PLAYWRIGHT_RUNNER_IMAGE: "node:24.22.1-bookworm-slim"
